<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="robots" content="noindex, nofollow" />
    <title>访问被禁止 (Forbidden)</title>

    <style>
        /* --- CSS Reset and Variables --- */
        :root {
            /* 极光主题色 */
            --aurora-color-1: #c24f4f; /* 调整为更偏向警告的红色系 */
            --aurora-color-2: #8a3a3a;
            --aurora-color-3: #41189a;
            --aurora-color-4: #dca0c7;

            --text-color: #f0f0f0;
            --glass-background: rgba(25, 25, 30, 0.55);
            --glass-border: rgba(255, 255, 255, 0.2);
            --input-background: rgba(0, 0, 0, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --animation-duration: 0.3s;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: rgb(36, 36, 37); /* Fallback background */
        }

        /* --- 极光 + 模糊背景 --- */
        .page-background {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: linear-gradient(-45deg, var(--aurora-color-1), var(--aurora-color-2), var(--aurora-color-3), var(--aurora-color-4));
            background-size: 400% 400%;
            filter: blur(60px); 
            animation: gradientBG 25s ease infinite; 
            z-index: 1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 居中容器 --- */
        .page-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- 提示卡片 --- */
        .content-card {
            background: var(--glass-background);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            padding: 40px;
            width: 100%;
            max-width: 520px; /* 可以适当调整宽度 */
            color: var(--text-color);
            text-align: center;
            transform: scale(0.95);
            animation: popIn 0.5s 0.2s ease-in-out forwards;
        }
        
        @keyframes popIn {
            to { transform: scale(1); }
        }
        
        /* --- 卡片内容样式 --- */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            color: #fff;
        }

        .card-header .icon {
            width: 42px;
            height: 42px;
            fill: #ff8a8a; /* 警告图标颜色 */
        }

        .card-header h1 {
            font-size: 1.8em;
            font-weight: bold;
        }

        .message {
            font-size: 1.1em;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
        }

        .message code {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 3px 6px;
            border-radius: 5px;
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            color: #4bd1f0; /* 代码高亮颜色 */
        }

        .ip-details {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="page-background"></div>

    <div class="page-wrapper"> 
        <div class="content-card">

            <div class="card-header">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                </svg>
                <h1>Forbidden</h1>
            </div>

            <p class="message">
                如果您是系统管理员，请将您的 IP 地址添加到白名单，或通过编辑您安装根目录下的 <code>config.yaml</code> 文件来禁用白名单模式。
            </p>
            
            <hr style="border: none; height: 1px; background-color: rgba(255, 255, 255, 0.2); margin: 25px 0;">
            
            <p class="ip-details">
                来自 {{ipDetails}} 的连接已被阻止。本次尝试已被记录。
            </p>

        </div>
    </div>

</body>
</html>

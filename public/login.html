<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />

    <title>Phoebe's 酒馆 - 登录</title>

    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        /* --- CSS Reset and Variables --- */
        :root {
            /* 极光主题色 */
            --aurora-color-1: #4bd1f0;
            --aurora-color-2: #66dfb6;
            --aurora-color-3: #41189a;
            --aurora-color-4: #dca0c7;

            --text-color: #f0f0f0;
            --glass-background: rgba(25, 25, 30, 0.55);
            --glass-border: rgba(255, 255, 255, 0.2);
            --input-background: rgba(0, 0, 0, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --animation-duration: 0.3s;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: rgb(36, 36, 37); /* Fallback background */
        }

        /* --- 极光 + 模糊背景 --- */
        .login-page-background {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: linear-gradient(-45deg, var(--aurora-color-1), var(--aurora-color-2), var(--aurora-color-3), var(--aurora-color-4));
            background-size: 400% 400%;
            filter: blur(60px); 
            animation: gradientBG 25s ease infinite; 
            z-index: 1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 居中容器 --- */
        .login-page-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- 登录卡片 --- */
        .login-card {
            background: var(--glass-background);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            color: var(--text-color);
            text-align: center;
            transform: scale(0.95);
            animation: popIn 0.5s 0.2s ease-in-out forwards;
        }
        
        @keyframes popIn {
            to { transform: scale(1); }
        }
        
        /* --- Error Message Style --- */
        #errorMessage {
            color: #ff8a8a;
            min-height: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }

        /* --- 表单元素 --- */
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            color: #fff;
        }

        .login-logo img {
            max-width: 50px;
        }

        .login-logo span {
            font-size: 1.8em;
            font-weight: bold;
        }

        .login-prompt {
            font-size: 1.1em;
            font-weight: 300;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.8);
        }

        .login-form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: var(--input-background);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1em;
            transition: border-color var(--animation-duration) ease, box-shadow var(--animation-duration) ease;
        }

        .login-form input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--glass-border);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .forgot-password-link {
            display: block;
            margin-top: -5px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9em;
            transition: color var(--animation-duration) ease;
        }
        
        .forgot-password-link:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .login-button {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color var(--animation-duration) ease, transform var(--animation-duration) ease;
        }

        .login-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .login-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body class="login">

    <div class="login-page-background"></div>

    <div id="shadow_popup" class="login-page-wrapper" style="opacity: 0;"> 
        <div class="login-card">

            <div class="login-logo">
                <img src="img/phoebe.png" alt="Logo"> 
                <span>Phoebe's 酒馆</span>
            </div>

            <h3 id="normalLoginPrompt" style="display:none;">Select an Account</h3>
            <p id="discreetLoginPrompt" class="login-prompt">
                请登录
            </p>

            <div class="login-form">
                <div id="errorMessage"></div>

                <div id="handleEntryBlock">
                    <input id="userHandle" type="text" placeholder="用户名" autocomplete="username">
                </div>
                <div id="passwordEntryBlock">
                    <input id="userPassword" type="password" placeholder="密码" autocomplete="current-password">
                </div>

                <a id="recoverPassword" href="#" class="forgot-password-link" onclick="return false;">忘记密码?</a>

                <div id="loginButton" class="login-button">登录</div>
            </div>

            <div id="userListBlock" style="display:none;" class="wide100p">
                <div id="userList" class="flex-container justifySpaceEvenly"></div>
            </div>
            <div id="passwordRecoveryBlock" style="display:none;">
                </div>

        </div>
    </div>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
</body>

</html>
